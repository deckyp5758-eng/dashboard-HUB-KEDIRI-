name: Build & Auto-Deploy Latest Web App

on:
  # 1. Otomatis deploy setiap ada commit baru (kode maupun data) di branch main
  push:
    branches: [main]

  # 2. Otomatis deploy setelah workflow sinkronisasi data selesai
  workflow_run:
    workflows: ["Sync Logistics Data (Code.gs <-> GitHub)"]
    types:
      - completed

  # 3. Bisa dijalankan manual kapan saja dari tab Actions
  workflow_dispatch:

# Jika ada beberapa perubahan beruntun, batalkan proses lama dan selalu deploy versi paling baru
concurrency:
  group: deploy-webapp-latest
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Code & Synced Data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Latest Logistics Data Snapshot Exists Before Build
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          mkdir -p public/data
          if [ -n "$GAS_WEBAPP_URL" ]; then
            echo "Menarik data terbaru dari GAS_WEBAPP_URL ke public/data/logistics-sync.json..."
            curl -sSL --fail --max-time 30 "${GAS_WEBAPP_URL}?force=1" -o /tmp/logistics-build.json && \
            node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync("/tmp/logistics-build.json", "utf8"));
              if (d && Array.isArray(d.onDutyRows)) {
                fs.writeFileSync("public/data/logistics-sync.json", JSON.stringify(d, null, 2));
                console.log("Berhasil menyertakan data terbaru ke dalam build:", d.stats);
              }
            ' || echo "Menggunakan file public/data/logistics-sync.json yang ada di repo."
          fi

      - name: Typecheck & Build Production Bundle
        run: |
          npm run lint
          npm run build

      - name: Stamp Build Version & Invalidate Old Service Worker Cache
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat <<EOF > dist/version.json
          {
            "version": "1.0.${GITHUB_RUN_NUMBER}",
            "commit": "${SHORT_SHA}",
            "builtAt": "${BUILD_TIME}"
          }
          EOF

          if [ -f dist/sw.js ]; then
            sed -i "s/dapp-cache-v[0-9a-zA-Z_-]*/dapp-cache-${SHORT_SHA}/g" dist/sw.js
          fi

      - name: Upload Production Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Latest Version to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Trigger Live Server Cache Refresh (If Full-Stack APP_URL Configured)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            echo "Menyegarkan cache di server utama: $APP_URL"
            curl -sSL "${APP_URL%/}/api/logistics-data?force=true" > /dev/null || true
          fi

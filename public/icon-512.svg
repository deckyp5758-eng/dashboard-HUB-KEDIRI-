<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  <!-- Glowing Truck Outline / Logo -->
  <g transform="translate(64, 80) scale(0.75)">
    <!-- Cabin -->
    <path d="M 60,320 L 60,180 C 60,160 76,140 100,140 L 260,140 L 340,220 L 380,220 C 400,220 420,240 420,260 L 420,320 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="12" />
    <!-- Windshield -->
    <path d="M 250,160 L 320,220 L 250,220 Z" fill="#0284c7" />
    <!-- Cargo Box container in blue -->
    <rect x="20" y="80" width="240" height="240" rx="16" fill="url(#blueGlow)" stroke="#ffffff" stroke-width="8"/>
    <!-- INFORMA style text / emblem in cargo box -->
    <text x="140" y="210" fill="#ffffff" font-size="44" font-weight="900" font-style="italic" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">HK</text>
    <text x="140" y="250" fill="#e0f2fe" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="3">INFORMA</text>
    <!-- Front Bumper Plate -->
    <rect x="360" y="290" width="80" height="24" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="400" y="306" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">HUB KDR</text>
    <!-- Wheels -->
    <circle cx="120" cy="340" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="10"/>
    <circle cx="120" cy="340" r="16" fill="#38bdf8"/>
    <circle cx="340" cy="340" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="10"/>
    <circle cx="340" cy="340" r="16" fill="#38bdf8"/>
  </g>
  <text x="256" y="440" fill="#38bdf8" font-size="34" font-weight="900" font-style="italic" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="6">HUB KEDIRI</text>
</svg>
